<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yekan ISO 20816 Training v1.1.2</title><style>.yekan-vt612{font-family:Tahoma,Arial,sans-serif;color:#122b46;background:#eff4f8}.yekan-vt612 *{box-sizing:border-box}.yekan-vt612 header{background:linear-gradient(115deg,#092b51,#17617d);color:white;padding:30px max(18px,calc((100vw - 1080px)/2))}.yekan-vt612 header p{color:#cfe5ed;line-height:2}.yekan-vt612 main{max-width:1080px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #d8e3eb;border-radius:16px;padding:23px;margin:16px 0;box-shadow:0 5px 22px #102a4310}.yekan-vt612 h1{font-size:25px}.yekan-vt612 h2{font-size:19px;margin:0 0 18px}.yekan-vt612 h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.yekan-vt612 label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.yekan-vt612 input,.yekan-vt612 select{width:100%;border:1px solid #b9cbd8;border-radius:9px;padding:12px;font:inherit;background:white;color:#102c49}.yekan-vt612 input:focus,.yekan-vt612 select:focus{outline:2px solid #78b7d3}.muted{font-size:12px;color:#52687a;line-height:2}.note{background:#f4f8fc;border-right:4px solid #28739b;padding:13px;border-radius:8px;line-height:2;margin:12px 0}.warn{background:#fff7e8;border-right-color:#c48d2a}.danger{background:#fff0f0;border-right-color:#d34b4b}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f0f6fb;padding:18px 12px;border-radius:12px}.stat b{font-size:26px;display:block;margin-top:8px;direction:ltr;text-align:right}.stat small{font-size:12px;color:#55718a}.yekan-vt612 button{background:#0b4a75;color:white;border:0;border-radius:9px;padding:12px 19px;cursor:pointer;font:inherit}a{color:#135b86}.yekan-vt612 table{width:100%;border-collapse:collapse}.yekan-vt612 th,.yekan-vt612 td{text-align:right;padding:12px;border-bottom:1px solid #e0e8ef;font-size:13px}.yekan-vt612 th{background:#f3f7fb}.hide{display:none!important}.pill{display:inline-block;padding:5px 9px;background:#e6eff6;border-radius:20px;font-size:12px}.ranges{display:flex;gap:8px;flex-wrap:wrap}.ranges span{border:1px solid #c6d6df;padding:10px;border-radius:8px;direction:ltr}.ranges .chosen{background:#daf2ed;border-color:#148870;color:#086852;font-weight:bold}#result{scroll-margin-top:18px}@media(max-width:670px){.grid,.results{grid-template-columns:1fr}.yekan-vt612 h1{font-size:21px}.card{padding:16px}}@media print{.yekan-vt612 header{padding:15px}.yekan-vt612 button{display:none}body{background:white}.card{box-shadow:none}}

</style></head><body><div data-config="{&quot;title&quot;: &quot;راهنمای انتخاب رنج ترنسمیتر سرعت ارتعاش VT612&quot;, &quot;subtitle&quot;: &quot;ارزیابی ناحیه‌های ارتعاش ماشین و پیشنهاد رنج سنسور سرعت ارتعاش یکان بر اساس بخش مرتبط استاندارد.&quot;, &quot;form_title&quot;: &quot;۱. مشخصات ماشین و محل اندازه‌گیری&quot;, &quot;result_title&quot;: &quot;۲. نتیجه ارزیابی و رنج&quot;, &quot;zones_title&quot;: &quot;توضیح ناحیه‌های ارتعاش A تا D&quot;, &quot;zone_a&quot;: &quot;وضعیت مطلوب&quot;, &quot;zone_b&quot;: &quot;مناسب برای کارکرد مداوم&quot;, &quot;zone_c&quot;: &quot;نامناسب برای کارکرد طولانی&quot;, &quot;zone_d&quot;: &quot;ارتعاش شدید؛ احتمال آسیب&quot;, &quot;safety_text&quot;: &quot;حد آلارم و مرز C/D ابزار ارزیابی اولیه‌اند؛ برای تعیین تریپ نهایی، توصیه سازنده، روند ارتعاش، عملکرد ماشین و الزامات حفاظتی باید بررسی شود.&quot;, &quot;footer_text&quot;: &quot;ابزار راهنمای اولیه انتخاب VT612 | شرکت یکان؛ نه تأییدیه تنظیم حفاظت&quot;, &quot;margin&quot;: 2, &quot;ranges&quot;: [10, 12.7, 20, 25.4], &quot;machines&quot;: {&quot;motor&quot;: {&quot;label&quot;: &quot;الکتروموتور صنعتی&quot;, &quot;standard&quot;: &quot;ISO 20816-3:2026&quot;}, &quot;steam&quot;: {&quot;label&quot;: &quot;توربین بخار / ژنراتور&quot;, &quot;standard&quot;: &quot;ISO 20816-3 / ISO 20816-2&quot;}, &quot;gas&quot;: {&quot;label&quot;: &quot;توربین گاز&quot;, &quot;standard&quot;: &quot;ISO 20816-3 / ISO 20816-4&quot;}, &quot;rotary&quot;: {&quot;label&quot;: &quot;کمپرسور دوار&quot;, &quot;standard&quot;: &quot;ISO 20816-3&quot;}, &quot;recip&quot;: {&quot;label&quot;: &quot;کمپرسور رفت‌وبرگشتی&quot;, &quot;standard&quot;: &quot;ISO 20816-8&quot;}, &quot;pump&quot;: {&quot;label&quot;: &quot;پمپ سانتریفیوژ / روتودینامیکی&quot;, &quot;standard&quot;: &quot;ISO 10816-7:2009&quot;}, &quot;fan&quot;: {&quot;label&quot;: &quot;فن / بلوئر صنعتی&quot;, &quot;standard&quot;: &quot;ISO 20816-3 / ISO 14694&quot;}, &quot;gear&quot;: {&quot;label&quot;: &quot;گیربکس مستقل&quot;, &quot;standard&quot;: &quot;ISO 20816-9&quot;}, &quot;hydro&quot;: {&quot;label&quot;: &quot;توربین آبی / نیروگاه تلمبه‌ذخیره‌ای&quot;, &quot;standard&quot;: &quot;ISO 20816-5&quot;}, &quot;wind&quot;: {&quot;label&quot;: &quot;توربین بادی&quot;, &quot;standard&quot;: &quot;ISO 20816-21&quot;}, &quot;other&quot;: {&quot;label&quot;: &quot;سایر ماشین‌های صنعتی (نورد، نوار نقاله و ...)&quot;, &quot;standard&quot;: &quot;ISO 20816-3&quot;}}, &quot;limits&quot;: {&quot;1&quot;: {&quot;rigid&quot;: [2.3, 4.5, 7.1], &quot;flex&quot;: [3.5, 7.1, 11]}, &quot;2&quot;: {&quot;rigid&quot;: [1.4, 2.8, 4.5], &quot;flex&quot;: [2.3, 4.5, 7.1]}}, &quot;pumps&quot;: {&quot;1&quot;: {&quot;low&quot;: [2.5, 4, 6.6], &quot;high&quot;: [3.5, 5, 7.6]}, &quot;2&quot;: {&quot;low&quot;: [3.2, 5.1, 8.5], &quot;high&quot;: [4.2, 6.1, 9.5]}}, &quot;form_labels&quot;: {&quot;machine&quot;: &quot;نوع ماشین&quot;, &quot;power&quot;: &quot;توان نامی ماشین (kW)&quot;, &quot;rpm&quot;: &quot;دور نامی (rpm)&quot;, &quot;support&quot;: &quot;نوع تکیه‌گاه در راستای اندازه‌گیری&quot;, &quot;point&quot;: &quot;محل / نوع سیگنال اندازه‌گیری&quot;, &quot;direction&quot;: &quot;جهت اندازه‌گیری&quot;, &quot;height&quot;: &quot;ارتفاع محور موتور از پایه (mm) — اختیاری&quot;, &quot;pumpCat&quot;: &quot;رده کاربرد پمپ مطابق ISO 10816-7&quot;, &quot;baseline&quot;: &quot;ارتعاش پایه در کارکرد سالم (mm/s RMS) — اختیاری&quot;, &quot;run&quot;: &quot;محاسبه و نمایش نتیجه&quot;}, &quot;en&quot;: {&quot;title&quot;: &quot;VT612 Vibration Velocity Transmitter Range Selector&quot;, &quot;subtitle&quot;: &quot;Assess machine vibration severity zones and select a YEKAN VT612 measuring range based on the applicable standard.&quot;, &quot;form_title&quot;: &quot;1. Machine and measurement information&quot;, &quot;result_title&quot;: &quot;2. Vibration evaluation and range&quot;, &quot;zone_a&quot;: &quot;Good condition&quot;, &quot;zone_b&quot;: &quot;Acceptable for continuous operation&quot;, &quot;zone_c&quot;: &quot;Unsuitable for prolonged operation&quot;, &quot;zone_d&quot;: &quot;Severe vibration; possible damage&quot;, &quot;footer_text&quot;: &quot;VT612 initial selection guide | YEKAN. Not a certified protective trip-setting tool.&quot;, &quot;form_labels&quot;: {&quot;machine&quot;: &quot;Machine type&quot;, &quot;power&quot;: &quot;Rated power (kW)&quot;, &quot;rpm&quot;: &quot;Rated rotational speed (rpm)&quot;, &quot;support&quot;: &quot;Support stiffness in measurement direction&quot;, &quot;point&quot;: &quot;Measurement point and signal&quot;, &quot;direction&quot;: &quot;Measurement direction&quot;, &quot;height&quot;: &quot;Motor shaft height above base (mm) — optional&quot;, &quot;pumpCat&quot;: &quot;Pump category per ISO 10816-7&quot;, &quot;baseline&quot;: &quot;Normal baseline vibration (mm/s RMS) — optional&quot;, &quot;run&quot;: &quot;Calculate and show results&quot;}, &quot;machines&quot;: {&quot;motor&quot;: &quot;Industrial electric motor&quot;, &quot;steam&quot;: &quot;Steam turbine / generator&quot;, &quot;gas&quot;: &quot;Gas turbine&quot;, &quot;rotary&quot;: &quot;Rotary compressor&quot;, &quot;recip&quot;: &quot;Reciprocating compressor&quot;, &quot;pump&quot;: &quot;Centrifugal / rotodynamic pump&quot;, &quot;fan&quot;: &quot;Industrial fan / blower&quot;, &quot;gear&quot;: &quot;Standalone gearbox&quot;, &quot;hydro&quot;: &quot;Hydraulic turbine / pumped storage&quot;, &quot;wind&quot;: &quot;Wind turbine&quot;, &quot;other&quot;: &quot;Other industrial machinery&quot;}, &quot;support&quot;: {&quot;rigid&quot;: &quot;Rigid support&quot;, &quot;flex&quot;: &quot;Flexible support&quot;}, &quot;point&quot;: {&quot;housing&quot;: &quot;Bearing housing / stationary machine casing (Velocity RMS)&quot;}, &quot;direction&quot;: {&quot;radial&quot;: &quot;Radial / horizontal or vertical&quot;, &quot;axial&quot;: &quot;Axial at thrust bearing&quot;}, &quot;pumpCat&quot;: {&quot;1&quot;: &quot;Category I — higher reliability requirement&quot;, &quot;2&quot;: &quot;Category II — general application&quot;}, &quot;placeholder_height&quot;: &quot;e.g. 250&quot;, &quot;placeholder_baseline&quot;: &quot;Enter measured baseline if available&quot;, &quot;support_note&quot;: &quot;Rigid/flexible support refers to the dynamic behavior of the machine-foundation system in the measurement direction; a concrete or steel base alone does not determine it.&quot;, &quot;initial_text&quot;: &quot;Complete the machine data and click Calculate.&quot;}, &quot;initial_lang&quot;: &quot;fa&quot;}" class="yekan-vt612" dir="rtl"><main><section class="card"><h2>۱. مشخصات ماشین و محل اندازه‌گیری</h2><div class="grid"><div><label for="machine">نوع ماشین</label><select id="machine"><option value="motor">الکتروموتور صنعتی — ISO 20816-3:2026</option><option value="steam">توربین بخار / ژنراتور — ISO 20816-3 / ISO 20816-2</option><option value="gas">توربین گاز — ISO 20816-3 / ISO 20816-4</option><option value="rotary">کمپرسور دوار — ISO 20816-3</option><option value="recip">کمپرسور رفت‌وبرگشتی — ISO 20816-8</option><option value="pump">پمپ سانتریفیوژ / روتودینامیکی — ISO 10816-7:2009</option><option value="fan">فن / بلوئر صنعتی — ISO 20816-3 / ISO 14694</option><option value="gear">گیربکس مستقل — ISO 20816-9</option><option value="hydro">توربین آبی / نیروگاه تلمبه‌ذخیره‌ای — ISO 20816-5</option><option value="wind">توربین بادی — ISO 20816-21</option><option value="other">سایر ماشین‌های صنعتی (نورد، نوار نقاله و ...) — ISO 20816-3</option></select></div><div><label for="power">توان نامی ماشین (kW)</label><input id="power" min="0.1" step="any" type="number" value="2000"/></div><div><label for="rpm">دور نامی (rpm)</label><input id="rpm" min="1" step="any" type="number" value="3000"/></div><div><label for="support">نوع تکیه‌گاه در راستای اندازه‌گیری</label><select id="support"><option value="rigid">صلب (Rigid)</option><option value="flex">انعطاف‌پذیر (Flexible)</option></select></div><div><label for="point">محل / نوع سیگنال اندازه‌گیری</label><select id="point"><option value="housing">روی محفظه یاتاقان / بدنه ثابت (Velocity RMS)</option></select></div><div><label for="direction">جهت اندازه‌گیری</label><select id="direction"><option value="radial">شعاعی / افقی یا عمودی</option><option value="axial">محوری روی یاتاقان محوری (Thrust bearing)</option></select></div><div id="motorRow"><label for="height">ارتفاع محور موتور از پایه (mm) — اختیاری</label><input id="height" min="1" placeholder="مثلاً 250" type="number"/></div><div class="hide" id="pumpRow"><label for="pumpCat">رده کاربرد پمپ مطابق ISO 10816-7</label><select id="pumpCat"><option value="1">Category I — حساسیت و قابلیت اطمینان بالاتر</option><option value="2">Category II — کاربرد عمومی</option></select></div><div><label for="baseline">ارتعاش پایه در کارکرد سالم (mm/s RMS) — اختیاری</label><input id="baseline" min="0" placeholder="اگر سابقه اندازه‌گیری دارید" step="any" type="number"/></div></div><p class="muted">تکیه‌گاه صلب/انعطاف‌پذیر به رفتار دینامیکی مجموعه ماشین و فونداسیون در جهت اندازه‌گیری بستگی دارد؛ صرفاً بتنی یا فلزی بودن پایه تعیین‌کننده نیست.</p><button id="run">محاسبه و نمایش نتیجه</button></section><section aria-live="polite" class="card" id="result"><h2>۲. نتیجه ارزیابی و رنج</h2><div class="note" id="out">اطلاعات ماشین را تکمیل کنید و «محاسبه» را بزنید.</div></section><footer class="muted" style="text-align:center;margin:20px">footer text</footer></main></div><script>
document.querySelectorAll('.yekan-vt612').forEach(root=>{const $=id=>root.querySelector('#'+id);const conf=JSON.parse(root.getAttribute('data-config'));const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Number(v).toLocaleString('en-US',{maximumFractionDigits:2});

 ['جدول C/D معادل تنظیم خودکار تریپ نیست. مقدار نهایی با سازنده و مسئول حفاظت ماشین تعیین شود.','The C/D boundary is not an automatic trip setpoint. Confirm the final trip value with the OEM and machine protection engineer.'],
 ['فقط برای بررسی مهندسی است.','is for engineering review only.'],
 ['مرز B/C (نقطه شروع بررسی، نه آلارم قطعی)','B/C boundary (starting point for review, not a final alarm setpoint)'],
 ['پیشنهاد اولیه مبتنی بر ارتعاش پایه','Preliminary estimate based on baseline vibration'],
 ['منبع عددی:','Numerical reference:'],
 ['تمام مقادیر سرعت RMS و مخصوص اندازه‌گیری در نقاط سازگار روی بدنه ثابت هستند.','All values are RMS velocity and apply to suitable measurement points on stationary machine parts.'],
 ['چاپ نتیجه','Print result'],['تکیه‌گاه صلب','Rigid support'],['تکیه‌گاه انعطاف‌پذیر','Flexible support'],
 ['گروه ','Group '],['رده ','Category '],['توان ','power '],['ارتعاش شدید','severe vibration'],
 ['۰ تا ','0–'],['میلی‌متر بر ثانیه','mm/s']
 ];
function translateResult(){if(lang!=='en')return;let host=$('out');let walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){let v=node.nodeValue;englishParts.forEach(([fa,en])=>{v=v.split(fa).join(en)});node.nodeValue=v}host.querySelectorAll('.yk-zone-lines span').forEach(node=>{const b=node.querySelector('strong');if(b){let z=b.textContent.trim().charAt(0).toLowerCase();if(en['zone_'+z]){node.lastChild.textContent=' '+en['zone_'+z]}}});}
function setLanguage(l){lang=l==='en'?'en':'fa';root.dir=lang==='en'?'ltr':'rtl';root.lang=lang;root.querySelectorAll('.yk-lang-btn').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false');b.classList.toggle('active',b.dataset.lang===lang)});
const fields=['form_title','result_title','footer_text'];const els=[root.querySelector('section.card h2'),root.querySelector('#result h2'),root.querySelector('footer')];fields.forEach((k,i)=>{els[i].textContent=lang==='en'?(en[k]||conf[k]):conf[k]});
Object.entries(conf.form_labels||{}).forEach(([id,v])=>{let el=root.querySelector('label[for="'+id+'"]');if(!el&&id==='run')el=$('run');if(el)el.textContent=lang==='en'?(en.form_labels?.[id]||v):v});
Object.entries(optionFa).forEach(([id,opts])=>{[...$(id).options].forEach((o,i)=>o.textContent=lang==='en'?(en[id]?.[o.value]||opts[i].text):opts[i].text)});
const selectedMachine=$('machine').value; $('machine').innerHTML=Object.entries(conf.machines).map(([k,v])=>`<option value="${esc(k)}">${esc(lang==='en'?(en.machines?.[k]||v.label):v.label)} — ${esc(v.standard)}</option>`).join('');$('machine').value=selectedMachine;
if(supportNote)supportNote.textContent=lang==='en'?(en.support_note||supportNote.dataset.fa):supportNote.dataset.fa;
$('height').placeholder=lang==='en'?(en.placeholder_height||'e.g. 250'):'مثلاً 250';$('baseline').placeholder=lang==='en'?(en.placeholder_baseline||'Enter baseline'):'اگر سابقه اندازه‌گیری دارید';
update();compute();}
const limits=conf.limits;
const pumps=conf.pumps;
function compute(){const m=$('machine').value,p=+$('power').value,n=+$('rpm').value,s=$('support').value,point=$('point').value,dir=$('direction').value,baseline=$('baseline').value.trim(),margin=Number(conf.margin)||2;let std='',ref='',vals=null,reason='',group='',uncertainty='';
if(!(p>0&&n>0)){showError('توان و دور باید اعداد مثبت باشند.');return}

if(m==='pump'){std='ISO 10816-7:2009';ref='جدول‌های شدت ارتعاش پمپ، Category I / II';const c=$('pumpCat').value;if(p<=1){reason='این بخش برای پمپ‌های با توان نامی بالاتر از ۱ kW تدوین شده است.'}else if(n<600){reason='برای پمپ‌های زیر ۶۰۰ rpm معیارهای تکمیلی جابه‌جایی ارتعاش نیز مطرح‌اند؛ پیش از تعیین رنج VT612، بررسی اختصاصی لازم است.'}else {vals=pumps[c][p>200?'high':'low'];group='رده '+(c==='1'?'I':'II')+' | توان '+(p>200?'> 200':'≤ 200')+' kW';uncertainty='اعداد جدول پمپ مربوط به ISO 10816-7:2009 هستند؛ شرایط کاربرد و استثناهای استاندارد باید تأیید شوند.'}}
else if(m==='recip'){std='ISO 20816-8:2018';reason='این استاندارد معیارهای ویژه مجموعه کمپرسور رفت‌وبرگشتی را دارد و جدول عمومی 20816-3 جایگزین آن نیست.'}
else if(m==='hydro'){std='ISO 20816-5:2018';reason='حدود وابسته به نوع توربین آبی، جهت شفت و محل یاتاقان هستند.'}
else if(m==='wind'){std='ISO 20816-21:2025';reason='طبقه‌بندی به توربین گیربکس‌دار/دایرکت‌درایو و محل اندازه‌گیری نیاز دارد.'}
else if(m==='gear'){std='ISO 20816-9:2020';reason='این استاندارد علاوه بر توان و دور، به نقاط اندازه‌گیری و شرایط آزمون گیربکس وابسته است.'}
else if(m==='steam'&&p>40000&&[1500,1800,3000,3600].includes(n)){std='ISO 20816-2:2017 + Amd 1:2024';reason='توربین/ژنراتور بزرگ به معیارهای ویژه یاتاقان فیلم روغن و محل اندازه‌گیری نیاز دارد.'}
else if(m==='gas'&&p>40000&&[1500,1800,3000,3600].includes(n)){std='ISO 20816-2:2017';reason='توربین گاز بزرگ باید طبق بخش ۲ و شرایط طراحی ارزیابی شود.'}
else if(m==='gas'&&p>3000){std='ISO 20816-4:2018';reason='برای توربین گاز بزرگ‌تر از ۳ MW با یاتاقان فیلم روغن و سرعت مشمول، بخش ۴ اعمال می‌شود؛ نوع یاتاقان و شرایط استثنا باید تأیید شوند.'}
else if(m==='fan'&&p<=300&&s==='flex'){std='ISO 14694 (و بررسی دامنه ISO 20816-3)';reason='برای فن کوچک با تکیه‌گاه انعطاف‌پذیر، جدول صنعتی بخش ۳ به‌طور عمومی قابل اعمال نیست.'}
else {std='ISO 20816-3:2026';ref='Annex A (ناحیه‌های ارزیابی سرعت ارتعاش)';if(n<120||n>30000){reason='دور خارج از دامنه ۱۲۰ تا ۳۰٬۰۰۰ rpm بخش ۳ است.'}else {const h=+$('height').value;let g=p>300?1:p>15?2:3;if(m==='motor'&&h>0){const hg=h>=315?1:h>=160?2:h>=56?3:null;if(hg&&hg!==g){reason='توان و ارتفاع محور موتور به گروه‌های متفاوت اشاره می‌کنند. گروه‌بندی را با اطلاعات طراحی موتور تأیید کنید.'}else if(!hg){reason='ارتفاع محور واردشده خارج از بازه‌های تعریف‌شده برای گروه‌بندی موتور است.'}}if(!reason){group='گروه '+g+' | '+(s==='rigid'?'تکیه‌گاه صلب':'تکیه‌گاه انعطاف‌پذیر');if(g===3){reason='ویرایش ۲۰۲۶ گروه ۳ را اضافه کرده است، اما اعداد جدول A.3 در داده‌های تأییدشده این ابزار موجود نیستند؛ عدد فرضی ارائه نمی‌شود.'}else vals=limits[g][s]}}}
if(!vals){$('out').className='note warn';$('out').innerHTML='<b>استاندارد مرتبط: '+esc(std)+'</b><p>'+esc(reason)+'</p><p>برای این انتخاب، تا تأیید جدول اختصاصی و شرایط کاربرد، آلارم/مرز شدید و رنج VT612 به‌صورت عددی اعلام نمی‌شود.</p>';translateResult();return}
const [ab,bc,cd]=vals;let alarm=baseline===''?bc:Math.min(+baseline+0.25*bc,1.25*bc);let alarmText=baseline===''?'مرز B/C (نقطه شروع بررسی، نه آلارم قطعی)':'پیشنهاد اولیه مبتنی بر ارتعاش پایه';let range=conf.ranges.find(r=>r>=cd+margin-1e-9);let safeRange=range?`۰ تا ${fmt(range)} mm/s RMS`:'رنج موجود کافی نیست';let milli=range?{alarm:4+16*alarm/range,severe:4+16*cd/range}:null;
$('out').className='';$('out').innerHTML=`<p><span class="pill">${std}</span> <span class="pill">${group}</span></p><div class="results"><div class="stat"><small>مرز A/B</small><b>${fmt(ab)}</b><small>mm/s RMS</small><div class="yk-zone-lines"><span><strong>A:</strong> ${esc(conf.zone_a)}</span><span><strong>B:</strong> ${esc(conf.zone_b)}</span></div></div><div class="stat"><small>مرز B/C</small><b>${fmt(bc)}</b><small>mm/s RMS</small><div class="yk-zone-lines"><span><strong>B:</strong> ${esc(conf.zone_b)}</span><span><strong>C:</strong> ${esc(conf.zone_c)}</span></div></div><div class="stat"><small>مرز C/D (ارتعاش شدید)</small><b>${fmt(cd)}</b><small>mm/s RMS</small><div class="yk-zone-lines"><span><strong>C:</strong> ${esc(conf.zone_c)}</span><span><strong>D:</strong> ${esc(conf.zone_d)}</span></div></div><div class="stat"><small>آلارم اولیه برای بررسی</small><b>${fmt(alarm)}</b><small>mm/s RMS</small></div></div><div class="note"><b>رنج پیشنهادی VT612: ${safeRange}</b><p>قاعده انتخاب یکان: کوچک‌ترین رنج موجود که حداقل ${fmt(margin)} mm/s بالاتر از مرز C/D باشد.</p><div class="ranges">${conf.ranges.map(r=>`<span class="${r===range?'chosen':''}">0–${fmt(r)}</span>`).join('')}</div></div><div class="note warn"><b>آلارم:</b> ${alarmText}؛ مقدار ${fmt(alarm)} mm/s فقط برای بررسی مهندسی است.<br><b>TRIP:</b> جدول C/D معادل تنظیم خودکار تریپ نیست. مقدار نهایی با سازنده و مسئول حفاظت ماشین تعیین شود.${milli?`<br><b>خروجی نظری ۴–۲۰ mA:</b> در حد آلارم ${fmt(milli.alarm)} mA و در مرز C/D برابر ${fmt(milli.severe)} mA (در صورت مقیاس‌بندی خطی).`:''}</div><p class="muted">منبع عددی: ${ref}. ${uncertainty} تمام مقادیر سرعت RMS و مخصوص اندازه‌گیری در نقاط سازگار روی بدنه ثابت هستند.</p><button type="button" class="yk-print">چاپ نتیجه</button>`;root.querySelector('.yk-print')?.addEventListener('click',()=>window.print());translateResult();
}
function showError(t){$('out').className='note danger';$('out').textContent=t;translateResult()}

// Profile values describe training scenarios, not generic machine ratings.
const trainingProfiles={"motor": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "steam": {"power": 10000, "rpm": 3000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "gas": {"power": 5000, "rpm": 15000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "rotary": {"power": 75, "rpm": 3000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "recip": {"power": 75, "rpm": 750, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "pump": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "fan": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "gear": {"power": 75, "rpm": 1500, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "hydro": {"power": 10000, "rpm": 300, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "wind": {"power": 5000, "rpm": 12.1, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}, "other": {"power": 75, "rpm": 1500, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "baseline": "", "pumpCat": "2"}};
const profileFields=['power','rpm','support','point','direction','height','baseline','pumpCat'];
const machineValues={};
let activeMachine=$('machine').value;
function applyProfile(values){
 profileFields.forEach(id=>{$(id).value=String(values[id]??'')});
 update();compute();
}
function changeMachine(){
 machineValues[activeMachine]=Object.fromEntries(profileFields.map(id=>[id,$(id).value]));
 activeMachine=$('machine').value;
 applyProfile(machineValues[activeMachine]||trainingProfiles[activeMachine]);
}

function update(){ $('pumpRow').classList.toggle('hide',$('machine').value!=='pump');$('motorRow').classList.toggle('hide',$('machine').value!=='motor');}
$('machine').addEventListener('change',changeMachine);$('run').addEventListener('click',()=>{compute();$('result').scrollIntoView({behavior:'smooth',block:'start'})});
if(supportNote)supportNote.dataset.fa=supportNote.textContent;
root.querySelectorAll('.yk-lang-btn').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
setLanguage(lang);
applyProfile(trainingProfiles[activeMachine]);
});
</script></body></html>
