/* Keep the outer background contained and prevent collapsing top margins. */
body{margin:0;padding:16px;background:#fff}
.yekan-vt612{border-radius:24px;padding:16px 4px;display:flow-root;overflow:hidden}
.yekan-vt612 main{margin:0 auto;padding:0 14px}
.yekan-vt612 main>section.card:first-child{margin-top:0}
@media(max-width:670px){body{padding:8px}.yekan-vt612{border-radius:20px;padding:12px 0}.yekan-vt612 main{padding:0 10px}}
.yekan-vt612 .results{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.yk-limit{border:1px solid;border-radius:14px;padding:22px 24px;break-inside:avoid}
.yk-limit.alarm{background:#fffbf2;border-color:#efdbb0}.yk-limit.stop{background:#fff6f5;border-color:#edcdca}
.yk-limit-label{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:bold}
.yk-limit-dot{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:#c18a22}.stop .yk-limit-dot{background:#c44b45}
.yk-boundary{font:13px Arial;color:#627386;direction:ltr}.yk-measurement{display:flex;align-items:baseline;gap:12px;margin-top:22px;direction:ltr;justify-content:flex-end}
.yk-measurement b{font:bold 42px/1 Arial;letter-spacing:-1px}.yk-measurement small{font:13px Arial;color:#627386}
.yekan-vt612 .sensor-range-label{font-size:18px}


@media(max-width:670px){.yekan-vt612 .results{grid-template-columns:1fr}.yk-limit{padding:18px}.yk-limit-label{font-size:20px}}
#yekan-print-report{display:none;direction:rtl;color:#18334b;font:11px Tahoma,Arial,sans-serif}
#yekan-print-report *{box-sizing:border-box}
#yekan-print-report .pr-page{width:100%}
#yekan-print-report .pr-header{display:grid;grid-template-columns:36mm minmax(0,1fr);direction:ltr;align-items:center;gap:18px;padding-bottom:16px;border-bottom:3px solid #164e70}
#yekan-print-report .pr-heading{grid-column:2;grid-row:1;direction:rtl;text-align:right}
#yekan-print-report .pr-logo{grid-column:1;grid-row:1;justify-self:start}
#yekan-print-report h1{font-size:20px;line-height:1.7;margin:0 0 8px}
#yekan-print-report .pr-website{font:12px Arial;color:#356079;direction:ltr;text-align:right}
#yekan-print-report .pr-logo{width:36mm;max-height:23mm;object-fit:contain;flex-shrink:0}
#yekan-print-report .pr-meta{display:flex;justify-content:space-between;padding:12px 0 18px;font-size:10px;color:#627687}
#yekan-print-report .pr-section{margin:0 0 18px;break-inside:avoid}
#yekan-print-report h2{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #dae4eb}
#yekan-print-report h2 i{background:#164e70;color:white;width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font:12px Arial}
#yekan-print-report .pr-details{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
#yekan-print-report .pr-item{padding:9px 0;border-bottom:1px solid #edf1f4;display:flex;justify-content:space-between;gap:10px;line-height:1.8}
#yekan-print-report .pr-item span{color:#61768a;flex-shrink:0}#yekan-print-report .pr-item b{font-weight:bold;text-align:left;overflow-wrap:anywhere}
#yekan-print-report .pr-limits{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#yekan-print-report .yk-limit{padding:16px 18px}#yekan-print-report .yk-limit-label{font-size:18px}
#yekan-print-report .yk-measurement{margin-top:16px;gap:10px}#yekan-print-report .yk-measurement b{font-size:30px}#yekan-print-report .yk-measurement small{font-size:11px}
#yekan-print-report .pr-range{margin-top:12px;border:1px solid #d5e4ed;background:#f5f9fc;border-radius:9px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#yekan-print-report .pr-range>b{font-size:16px}#yekan-print-report .pr-range>strong{font: bold 21px Arial;direction:ltr}#yekan-print-report .pr-range small{font:11px Arial}
#yekan-print-report .pr-note{font-size:10px;line-height:2;color:#61768a;margin:10px 0 0}
#yekan-print-report table{width:100%;border-collapse:collapse}#yekan-print-report th{background:#f0f5f8;padding:11px 16px;text-align:right}
#yekan-print-report td{padding:12px 16px;border-bottom:1px solid #e0e8ee}#yekan-print-report td:last-child{font-weight:bold}
#yekan-print-report .pr-message{padding:16px;background:#fff8ed;border-right:3px solid #c18a22;line-height:2;white-space:pre-line}
#yekan-print-report .pr-footer{display:flex;justify-content:space-between;border-top:1px solid #d7e2e9;padding-top:12px;margin-top:22px;font-size:9px;color:#6a7d8e}

hine-foundation system in the measurement direction; a concrete or steel base alone does not determine it.&quot;, &quot;initial_text&quot;: &quot;Complete the machine data and click Calculate.&quot;}, &quot;initial_lang&quot;: &quot;fa&quot;}" class="yekan-vt612" dir="rtl"><main><section class="card"><h2>۱. مشخصات ماشین و محل اندازه‌گیری</h2><div class="grid"><div><label for="machine">نوع ماشین</label><select id="machine"><option value="motor">الکتروموتور صنعتی — ISO 20816-3:2026</option><option value="steam">توربین بخار / ژنراتور — ISO 20816-3 / ISO 20816-2</option><option value="gas">توربین گاز — ISO 20816-3 / ISO 20816-4</option><option value="rotary">کمپرسور دوار — ISO 20816-3</option><option value="recip">کمپرسور رفت‌وبرگشتی — ISO 20816-8</option><option value="pump">پمپ سانتریفیوژ / روتودینامیکی — ISO 10816-7:2009</option><option value="fan">فن / بلوئر صنعتی — ISO 20816-3 / ISO 14694</option><option value="gear">گیربکس مستقل — ISO 20816-9</option><option value="hydro">توربین آبی / نیروگاه تلمبه‌ذخیره‌ای — ISO 20816-5</option><option value="wind">توربین بادی — ISO 20816-21</option><option value="other">سایر ماشین‌های صنعتی (نورد، نوار نقاله و ...) — ISO 20816-3</option></select></div><div><label for="power">توان نامی ماشین (kW)</label><input id="power" min="0.1" step="any" type="number" value="2000"/></div><div><label for="rpm">دور نامی (rpm)</label><input id="rpm" min="1" step="any" type="number" value="3000"/></div><div><label for="support">نوع تکیه‌گاه در راستای اندازه‌گیری</label><select id="support"><option value="rigid">صلب (Rigid)</option><option value="flex">انعطاف‌پذیر (Flexible)</option></select></div><div><label for="point">محل / نوع سیگنال اندازه‌گیری</label><select id="point"><option value="housing">روی محفظه یاتاقان / بدنه ثابت (Velocity RMS)</option></select></div><div><label for="direction">جهت اندازه‌گیری</label><select id="direction"><option value="radial">شعاعی / افقی یا عمودی</option><option value="axial">محوری روی یاتاقان محوری (Thrust bearing)</option></select></div><div id="motorRow"><label for="height">ارتفاع محور موتور از پایه (mm) — اختیاری</label><input id="height" min="1" placeholder="مثلاً 250" type="number"/></div><div class="hide" id="pumpRow"><label for="pumpCat">رده کاربرد پمپ مطابق ISO 10816-7</label><select id="pumpCat"><option value="1">Category I — حساسیت و قابلیت اطمینان بالاتر</option><option value="2">Category II — کاربرد عمومی</option></select></div></div><p class="muted">تکیه‌گاه صلب/انعطاف‌پذیر به رفتار دینامیکی مجموعه ماشین و فونداسیون در جهت اندازه‌گیری بستگی دارد؛ صرفاً بتنی یا فلزی بودن پایه تعیین‌کننده نیست.</p><button id="run">محاسبه و نمایش نتیجه</button></section><section aria-live="polite" class="card" id="result"><h2>2. رنج پیشنهادی</h2><div class="note" id="out">اطلاعات ماشین را تکمیل کنید و «محاسبه» را بزنید.</div></section><footer class="muted" style="text-align:center;margin:20px">footer text</footer></main></div><div id="yekan-print-report" dir="rtl" aria-label="گزارش چاپی"></div><script>
document.querySelectorAll('.yekan-vt612').forEach(root=>{const $=id=>root.querySelector('#'+id);const conf=JSON.parse(root.getAttribute('data-config'));const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Number(v).toLocaleString('en-US',{maximumFractionDigits:2});

if(!(p>0&&n>0)){showError('توان و دور باید اعداد مثبت باشند.');return}

if(m==='pump'){std='ISO 10816-7:2009';ref='جدول‌های شدت ارتعاش پمپ، Category I / II';const c=$('pumpCat').value;if(p<=1){reason='این بخش برای پمپ‌های با توان نامی بالاتر از ۱ kW تدوین شده است.'}else if(n<600){reason='برای پمپ‌های زیر ۶۰۰ rpm معیارهای تکمیلی جابه‌جایی ارتعاش نیز مطرح‌اند؛ پیش از تعیین رنج VT612، بررسی اختصاصی لازم است.'}else {vals=pumps[c][p>200?'high':'low'];group='رده '+(c==='1'?'I':'II')+' | توان '+(p>200?'> 200':'≤ 200')+' kW';uncertainty='اعداد جدول پمپ مربوط به ISO 10816-7:2009 هستند؛ شرایط کاربرد و استثناهای استاندارد باید تأیید شوند.'}}
else if(m==='recip'){std='ISO 20816-8:2018';reason='این استاندارد معیارهای ویژه مجموعه کمپرسور رفت‌وبرگشتی را دارد و جدول عمومی 20816-3 جایگزین آن نیست.'}
else if(m==='hydro'){std='ISO 20816-5:2018';reason='حدود وابسته به نوع توربین آبی، جهت شفت و محل یاتاقان هستند.'}
else if(m==='wind'){std='ISO 20816-21:2025';reason='طبقه‌بندی به توربین گیربکس‌دار/دایرکت‌درایو و محل اندازه‌گیری نیاز دارد.'}
else if(m==='gear'){std='ISO 20816-9:2020';reason='این استاندارد علاوه بر توان و دور، به نقاط اندازه‌گیری و شرایط آزمون گیربکس وابسته است.'}
else if(m==='steam'&&p>40000&&[1500,1800,3000,3600].includes(n)){std='ISO 20816-2:2017 + Amd 1:2024';reason='توربین/ژنراتور بزرگ به معیارهای ویژه یاتاقان فیلم روغن و محل اندازه‌گیری نیاز دارد.'}
else if(m==='gas'&&p>40000&&[1500,1800,3000,3600].includes(n)){std='ISO 20816-2:2017';reason='توربین گاز بزرگ باید طبق بخش ۲ و شرایط طراحی ارزیابی شود.'}
else if(m==='gas'&&p>3000){std='ISO 20816-4:2018';reason='برای توربین گاز بزرگ‌تر از ۳ MW با یاتاقان فیلم روغن و سرعت مشمول، بخش ۴ اعمال می‌شود؛ نوع یاتاقان و شرایط استثنا باید تأیید شوند.'}
else if(m==='fan'&&p<=300&&s==='flex'){std='ISO 14694 (و بررسی دامنه ISO 20816-3)';reason='برای فن کوچک با تکیه‌گاه انعطاف‌پذیر، جدول صنعتی بخش ۳ به‌طور عمومی قابل اعمال نیست.'}
else {std='ISO 20816-3:2026';ref='Annex A (ناحیه‌های ارزیابی سرعت ارتعاش)';if(n<120||n>30000){reason='دور خارج از دامنه ۱۲۰ تا ۳۰٬۰۰۰ rpm بخش ۳ است.'}else {const h=+$('height').value;let g=p>300?1:p>15?2:3;if(m==='motor'&&h>0){const hg=h>=315?1:h>=160?2:h>=56?3:null;if(hg&&hg!==g){reason='توان و ارتفاع محور موتور به گروه‌های متفاوت اشاره می‌کنند. گروه‌بندی را با اطلاعات طراحی موتور تأیید کنید.'}else if(!hg){reason='ارتفاع محور واردشده خارج از بازه‌های تعریف‌شده برای گروه‌بندی موتور است.'}}if(!reason){group='گروه '+g+' | '+(s==='rigid'?'تکیه‌گاه صلب':'تکیه‌گاه انعطاف‌پذیر');if(g===3){reason='ویرایش ۲۰۲۶ گروه ۳ را اضافه کرده است، اما اعداد جدول A.3 در داده‌های تأییدشده این ابزار موجود نیستند؛ عدد فرضی ارائه نمی‌شود.'}else vals=limits[g][s]}}}
if(!vals){$('out').className='note warn';$('out').innerHTML='<b>استاندارد مرتبط: '+esc(std)+'</b><p>'+esc(reason)+'</p><p>برای این انتخاب، تا تأیید جدول اختصاصی و شرایط کاربرد، آلارم/مرز شدید و رنج VT612 به‌صورت عددی اعلام نمی‌شود.</p>';translateResult();appendWarningPrint();return}
const [,bc,cd]=vals;const alarm=bc;let range=conf.ranges.find(r=>r>=cd+margin-1e-9);let safeRange=range?`۰ تا ${fmt(range)} mm/s RMS`:'رنج موجود کافی نیست';let milli=range?{alarm:4+16*alarm/range,severe:4+16*cd/range}:null;
resultState={alarm,stop:cd,range,milli,margin};
$('out').className='';$('out').innerHTML=`<div class="results">${limitMarkup('alarm','حد آلارم','B/C',bc)}${limitMarkup('stop','حد توقف','C/D',cd)}</div><div class="note"><b class="sensor-range-label">رنج سنسور پیشنهادی: ${safeRange}</b><p>قاعده انتخاب: کوچک‌ترین رنج موجود که حداقل ${fmt(margin)} mm/s بالاتر از حد توقف (C/D) باشد.</p><div class="ranges">${conf.ranges.map(r=>`<span class="${r===range?'chosen':''}">0–${fmt(r)}</span>`).join('')}</div></div>${milli?`<div class="note warn"><b>در این حالت، خروجی سنسور:</b><br>حد آلارم: <strong>${fmt(milli.alarm)} میلی‌آمپر</strong><br>حد توقف: <strong>${fmt(milli.severe)} میلی‌آمپر</strong><br><small>با فرض خروجی خطی ۴ تا ۲۰ میلی‌آمپر در رنج انتخاب‌شده.</small></div>`:''}<button type="button" class="yk-print">چاپ نتیجه</button>`;
root.querySelector('.yk-print').addEventListener('click',printReport);translateResult();
}
function limitMarkup(type,label,boundary,value){return `<div class="yk-limit ${type}"><div class="yk-limit-label"><span class="yk-limit-dot"></span><span>${label}</span><span class="yk-boundary">(${boundary})</span></div><div class="yk-measurement"><small>mm/s RMS</small><b>${fmt(value)}</b></div></div>`}
function showError(t){$('out').className='note danger';$('out').textContent=t;translateResult();appendWarningPrint()}
function appendWarningPrint(){const button=document.createElement('button');button.type='button';button.className='yk-print';button.textContent='چاپ نتیجه';button.addEventListener('click',printReport);$('out').appendChild(button)}

// Profile values describe training scenarios, not generic machine ratings.
const trainingProfiles={"motor": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "steam": {"power": 10000, "rpm": 3000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "gas": {"power": 5000, "rpm": 15000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "rotary": {"power": 75, "rpm": 3000, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "recip": {"power": 75, "rpm": 750, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "pump": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "fan": {"power": 75, "rpm": 1480, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "gear": {"power": 75, "rpm": 1500, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "hydro": {"power": 10000, "rpm": 300, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "wind": {"power": 5000, "rpm": 12.1, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}, "other": {"power": 75, "rpm": 1500, "support": "rigid", "point": "housing", "direction": "radial", "height": "", "pumpCat": "2"}};
const profileFields=['power','rpm','support','point','direction','height','pumpCat'];
const machineValues={};
let activeMachine=$('machine').value;
function applyProfile(values){
 profileFields.forEach(id=>{$(id).value=String(values[id]??'')});
 update();compute();
}
function changeMachine(){
 machineValues[activeMachine]=Object.fromEntries(profileFields.map(id=>[id,$(id).value]));
 activeMachine=$('machine').value;
 applyProfile(machineValues[activeMachine]||trainingProfiles[activeMachine]);
}

function update(){ $('pumpRow').classList.toggle('hide',$('machine').value!=='pump');$('motorRow').classList.toggle('hide',$('machine').value!=='motor');}
$('machine').addEventListener('change',changeMachine);$('run').addEventListener('click',()=>{compute();$('result').scrollIntoView({behavior:'smooth',block:'start'})});
if(supportNote)supportNote.dataset.fa=supportNote.textContent;
root.querySelectorAll('.yk-lang-btn').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
// The report uses the current calculated state, never values scraped from result labels.
// This fixed asset is supplied once by the site owner and shared by all visitors.
const reportLogo=document.querySelector('meta[name="yekan-report-logo"]').content;
const reportRoot=document.getElementById('yekan-print-report');
const fieldText=id=>{const input=$(id);return input.tagName==='SELECT'?input.selectedOptions[0]?.textContent||'وارد نشده':input.value.trim()||'وارد نشده'};
const unitValue=(id,unit)=>$(id).value.trim()?esc($(id).value.trim())+' '+unit:'وارد نشده';
function buildReport(){
 const machine=fieldText('machine');
 const entries=[['نوع ماشین',esc(machine)],['توان نامی',unitValue('power','kW')],['دور نامی',unitValue('rpm','rpm')],['نوع تکیه‌گاه',esc(fieldText('support'))],['محل اندازه‌گیری',esc(fieldText('point'))],['جهت اندازه‌گیری',esc(fieldText('direction'))]];
 if($('machine').value==='motor')entries.push(['ارتفاع محور موتور',unitValue('height','mm')]);
 if($('machine').value==='pump')entries.push(['رده کاربرد پمپ',esc(fieldText('pumpCat'))]);
 const details=entries.map(([k,v])=>`<div class="pr-item"><span>${k}</span><b>${v}</b></div>`).join('');
 const section=(n,title,body)=>`<section class="pr-section"><h2><i>${n}</i>${title}</h2>${body}</section>`;
 let results;
 if(resultState){
  const r=resultState;
  results=section(2,'رنج پیشنهادی',`<div class="pr-limits">${limitMarkup('alarm','حد آلارم','B/C',r.alarm)}${limitMarkup('stop','حد توقف','C/D',r.stop)}</div><div class="pr-range"><b>رنج سنسور پیشنهادی</b><strong>${r.range?'0–'+fmt(r.range)+' <small>mm/s RMS</small>':'رنج موجود کافی نیست'}</strong></div><p class="pr-note">قاعده انتخاب: کوچک‌ترین رنج موجود که حداقل ${fmt(r.margin)} mm/s بالاتر از حد توقف (C/D) باشد.</p>`);
  if(r.milli)results+=section(3,'جریان خروجی سنسور',`<table><thead><tr><th>وضعیت</th><th>خروجی سنسور</th></tr></thead><tbody><tr><td>حد آلارم</td><td><bdi>${fmt(r.milli.alarm)} mA</bdi></td></tr><tr><td>حد توقف</td><td><bdi>${fmt(r.milli.severe)} mA</bdi></td></tr></tbody></table><p class="pr-note">با فرض خروجی خطی ۴ تا ۲۰ میلی‌آمپر در رنج انتخاب‌شده.</p>`);
 }else{
  results=section(2,'نتیجه ارزیابی',`<div class="pr-message">${esc([...$('out').childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('yk-print'))).map(n=>n.textContent).join('\n'))}</div>`);
 }
 reportRoot.innerHTML=`<article class="pr-page"><div class="pr-header"><div class="pr-heading"><h1>راهنمای انتخاب رنج ترانسمیتر ارتعاش</h1><div class="pr-website">www.Yekan-Vibro.com</div></div>${reportLogo?`<img class="pr-logo" src="${esc(reportLogo)}" alt="لوگوی یکان">`:''}</div><div class="pr-meta"><span>گزارش انتخاب رنج سنسور</span><span>نسخه 1.2.5</span></div>${section(1,'مشخصات ماشین و اندازه‌گیری',`<div class="pr-details">${details}</div>`)}${results}<div class="pr-footer"><span>یکان · گزارش انتخاب رنج ترانسمیتر ارتعاش</span><span>۱ / ۱</span></div></article>`;
}
async function prepareReport(){compute();buildReport();await Promise.all([...reportRoot.querySelectorAll('img')].map(img=>img.decode().catch(()=>{})));}
async function printReport(){await prepareReport();window.print();}
window.addEventListener('beforeprint',()=>{compute();buildReport()});
// A direct browser print (Ctrl+P) uses the same report, too.
root.querySelectorAll('input,select').forEach(input=>{input.addEventListener('input',()=>{resultState=null})});

setLanguage(lang);
applyProfile(trainingProfiles[activeMachine]);
buildReport();
});
</script></body></html>
